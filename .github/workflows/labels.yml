name: labels

# .github/labels.yml の内容で、リポジトリのラベルをそろえる
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # サードパーティの Action はコミットのハッシュで固定する（v6.0.0）
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
